<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Sign In — Cycology Cycling Club</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#D60B52" />
  <link rel="icon" href="../assets/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="admin-login-page">
  <main id="main">
    <div class="login-card">
      <a class="login-brand" href="../index.html">
        <img src="../assets/logo-mark.png" alt="Cycology" width="108" height="51" />
      </a>

      <!-- Normal sign-in -->
      <section id="login-view">
        <h1>Admin sign in</h1>
        <p class="login-lead">Manage blog posts and form submissions.</p>
        <form class="form" id="login-form" autocomplete="on">
          <div>
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required autofocus />
          </div>
          <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="submit" id="login-btn">Sign in</button>
          </div>
          <p class="admin-note" id="login-msg" role="alert"></p>
        </form>
      </section>

      <!-- First run: no account exists yet -->
      <section id="setup-view" hidden>
        <h1>Create the first admin</h1>
        <p class="login-lead">
          No admin account exists yet. To prove you own this server, paste the
          <code>admin_token</code> from <code>api/config.php</code>.
        </p>
        <form class="form" id="setup-form" autocomplete="off">
          <div>
            <label for="s-token">Setup token <span class="req">*</span></label>
            <input id="s-token" type="password" required />
          </div>
          <div class="form-grid">
            <div>
              <label for="s-username">Username <span class="req">*</span></label>
              <input id="s-username" required placeholder="e.g. cycology-admin" />
            </div>
            <div>
              <label for="s-name">Your name</label>
              <input id="s-name" placeholder="e.g. Akinlade" />
            </div>
          </div>
          <div>
            <label for="s-password">Password <span class="req">*</span> <small>(10 characters or more)</small></label>
            <input id="s-password" type="password" required minlength="10" />
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="submit" id="setup-btn">Create account &amp; sign in</button>
          </div>
          <p class="admin-note" id="setup-msg" role="alert"></p>
        </form>
      </section>

      <p class="login-back"><a href="../index.html">← Back to the website</a></p>
    </div>
  </main>

  <script src="../js/admin-auth.js" defer></script>
  <script src="../js/admin-login.js" defer></script>
</body>
</html>
