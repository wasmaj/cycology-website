<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Form Submissions — Cycology Cycling Club</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#D60B52" />
  <link rel="icon" href="../assets/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <div id="admin-shell"></div>

  <main id="main">
    <header class="page-header page-header--admin">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb">
          <a href="../index.html">Home</a> <span>/</span>
          <span aria-current="page">Form Submissions</span>
        </nav>
        <h1>Form Submissions</h1>
        <p style="max-width: 640px; color:#d6dbe2; margin: 0;">Every contact message and membership application, with CSV and Excel download.</p>
      </div>
    </header>

    <section class="section admin-panel" id="panel-section">
      <div class="container">
        <div class="admin-toolbar">
          <div class="admin-tabs" id="form-tabs" role="group" aria-label="Filter by form"></div>
          <div class="actions">
            <button type="button" class="btn btn-primary btn-sm" id="btn-csv">⬇ Download CSV</button>
            <button type="button" class="btn btn-dark btn-sm" id="btn-xlsx">⬇ Download Excel</button>
          </div>
        </div>

        <div class="admin-filters">
          <div>
            <label for="f-q">Search</label>
            <input type="search" id="f-q" placeholder="Name, email, phone or message…" />
          </div>
          <div>
            <label for="f-from">From date</label>
            <input type="date" id="f-from" />
          </div>
          <div>
            <label for="f-to">To date</label>
            <input type="date" id="f-to" />
          </div>
          <div class="admin-filters-actions">
            <button type="button" class="btn btn-dark btn-sm" id="btn-apply">Apply</button>
            <button type="button" class="btn btn-ghost btn-sm" id="btn-clear">Clear</button>
          </div>
        </div>

        <p class="admin-note" id="panel-msg" role="status"></p>

        <div class="admin-table-wrap">
          <table class="admin-table" id="sub-table">
            <thead>
              <tr>
                <th>Received</th>
                <th>Form</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Emailed</th>
                <th class="admin-actions-col">Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="admin-pager" id="pager" hidden>
          <button type="button" class="btn btn-dark btn-sm" id="btn-prev">← Newer</button>
          <span id="pager-label"></span>
          <button type="button" class="btn btn-dark btn-sm" id="btn-next">Older →</button>
        </div>
      </div>
    </section>

    <!-- Detail dialog -->
    <dialog class="admin-dialog" id="detail">
      <h3 id="detail-title">Submission</h3>
      <p class="admin-note" id="detail-meta"></p>
      <dl class="admin-detail" id="detail-body"></dl>
      <div class="actions">
        <a class="btn btn-primary btn-sm" id="detail-reply" href="#">Reply by email</a>
        <button type="button" class="btn btn-dark btn-sm" id="detail-close">Close</button>
      </div>
    </dialog>
  </main>

  <div id="site-footer"></div>
  <script src="../js/main.js" defer></script>
  <script src="../js/admin-auth.js" defer></script>
  <script src="../js/admin-submissions.js" defer></script>
</body>
</html>
