<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery — Cycology Cycling Club</title>
  <meta name="description" content="Photo albums from Cycology rides, races and celebrations — including Cycolobration, the Amazon Crit and the Amazon Ride." />
  <meta name="theme-color" content="#D60B52" />
  <link rel="icon" href="../assets/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main id="main">
    <header class="page-header">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb">
          <a href="../index.html">Home</a> <span>/</span>
          <a href="#">Events</a> <span>/</span>
          <span aria-current="page">Gallery</span>
        </nav>
        <h1>Gallery</h1>
        <p style="max-width: 640px; color:#d6dbe2; margin: 0;">Moments from our rides, races and community celebrations — browse by event.</p>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <span class="eyebrow">Albums</span>
        <h2 class="section-title">Browse by event.</h2>
        <p class="section-lead">Pick an album to see the full set of photos. Newest events first.</p>

        <!--
          ALBUM INDEX
          ===========
          The grid of album cards below is built by js/gallery.js from the
          ALBUMS list in that file. To add an album, drop photos into
          images/gallery/<slug>/ and add an entry to ALBUMS.
        -->
        <div class="grid grid-3" data-album-index aria-live="polite">
          <p class="gallery-loading">Loading albums…</p>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="../js/main.js" defer></script>
  <script src="../js/gallery.js" defer></script>
</body>
</html>
